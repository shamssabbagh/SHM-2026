<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="100%">
  <defs>
    <radialGradient id="sensory-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="380" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

  <!-- Left: Sensory Pentagram Diagram -->
  <g transform="translate(190, 190)">
    <circle cx="0" cy="0" r="140" fill="url(#sensory-glow)" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="50" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="-6" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="800" fill="#c7d2fe" text-anchor="middle">תפיסת</text>
    <text x="0" y="14" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">ערך מותג</text>

    <!-- Node 1: Sight (Top) -->
    <line x1="0" y1="-50" x2="0" y2="-120" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-120" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-115" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">👁️</text>
    <text x="0" y="-155" font-family="'Heebo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle">ראייה (צבעים/עיצוב)</text>

    <!-- Node 2: Sound (Right-Top) -->
    <line x1="47" y1="-15" x2="114" y2="-37" stroke="#818cf8" stroke-width="2"/>
    <circle cx="114" cy="-37" r="28" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="114" y="-32" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🎵</text>
    <text x="114" y="8" font-family="'Heebo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">שמיעה (סאונד ומקצב)</text>

    <!-- Node 3: Touch (Right-Bottom) -->
    <line x1="29" y1="40" x2="70" y2="97" stroke="#34d399" stroke-width="2"/>
    <circle cx="70" cy="97" r="28" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="70" y="102" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">✋</text>
    <text x="70" y="142" font-family="'Heebo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">מגע (מרקם ומשקל)</text>

    <!-- Node 4: Smell (Left-Bottom) -->
    <line x1="-29" y1="40" x2="-70" y2="97" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="-70" cy="97" r="28" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="-70" y="102" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">☕</text>
    <text x="-70" y="142" font-family="'Heebo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">ריח (הצפה רגשית)</text>

    <!-- Node 5: Taste (Left-Top) -->
    <line x1="-47" y1="-15" x2="-114" y2="-37" stroke="#fb7185" stroke-width="2"/>
    <circle cx="-114" cy="-37" r="28" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <text x="-114" y="-32" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🍫</text>
    <text x="-114" y="8" font-family="'Heebo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fda4af" text-anchor="middle">טעם (חוויית מוצר)</text>
  </g>

  <!-- Right: Insights List -->
  <g transform="translate(390, 45)">
    <text x="290" y="25" font-family="'Heebo', system-ui, sans-serif" font-size="19" font-weight="800" fill="#c084fc" text-anchor="end">שיווק חושי (Sensory Marketing)</text>
    <text x="290" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">עיבוד רב-חושי והשפעתו על נכונות לשלם</text>

    <g transform="translate(0, 70)">
      <rect width="290" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="275" y="24" font-family="'Heebo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="end">השפעת המשקל (Embodied Cognition)</text>
      <text x="275" y="44" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="end">אריזות כבדות מעלות באופן בלתי מודע את תפיסת האיכות והיוקרה.</text>
    </g>

    <g transform="translate(0, 140)">
      <rect width="290" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="275" y="24" font-family="'Heebo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="end">ריח כאפיק לזיכרון אפיזודי ישיר</text>
      <text x="275" y="44" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="end">מערכת הריח מקושרת ישירות לאמיגדלה ללא תיווך תלמוסי.</text>
    </g>

    <g transform="translate(0, 210)">
      <rect width="290" height="58" rx="8" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" stroke-width="1"/>
      <text x="275" y="24" font-family="'Heebo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e9d5ff" text-anchor="end">סאונד מיתוגי (Sonic Branding)</text>
      <text x="275" y="44" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#f3e8ff" text-anchor="end">צליל הפתיחה של פחית או לוגו קולי מעורר ציפייה להנאה.</text>
    </g>
  </g>
</svg>
