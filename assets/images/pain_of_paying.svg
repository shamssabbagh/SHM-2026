<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" height="100%">
  <defs>
    <linearGradient id="painBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F5"/>
      <stop offset="100%" stop-color="#F7F3ED"/>
    </linearGradient>
  </defs>

  <rect width="720" height="340" rx="14" fill="url(#painBgGrad)" stroke="#DEC7D0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="680" y="38" font-family="'Heebo', system-ui, sans-serif" font-size="19" font-weight="800" fill="#502638" text-anchor="end">"כאב התשלום" וארנקים דיגיטליים (The Pain of Paying)</text>
  <text x="680" y="58" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#5A5258" text-anchor="end">כיצד מעבר ממזומן לתשלום דיגיטלי מרדים את הפעלת האינסולה (Prelec &amp; Loewenstein)</text>

  <!-- Left: Cash payment (High Pain) -->
  <g transform="translate(60, 90)">
    <rect width="280" height="215" rx="12" fill="#FFF6F5" stroke="#D85B49" stroke-width="1.5"/>
    <circle cx="140" cy="45" r="26" fill="rgba(216, 91, 73, 0.15)"/>
    <text x="140" y="53" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">💵</text>
    <text x="140" y="95" font-family="'Heebo', system-ui, sans-serif" font-size="16" font-weight="800" fill="#B83D2B" text-anchor="middle">תשלום במזומן</text>
    
    <!-- Pain Indicator High -->
    <rect x="30" y="115" width="220" height="24" rx="12" fill="#F2E7EB"/>
    <rect x="30" y="115" width="195" height="24" rx="12" fill="#D85B49"/>
    <text x="127" y="131" font-family="'Heebo', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">כאב פסיכולוגי גבוה (High Pain)</text>

    <text x="250" y="168" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="600" fill="#252329" text-anchor="end">• פרידה פיזית מוחשית משטרות כסף</text>
    <text x="250" y="190" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="600" fill="#252329" text-anchor="end">• הפעלה מידית של אינסולה (Insula)</text>
  </g>

  <!-- Right: Digital / 1-Click (Frictionless) -->
  <g transform="translate(380, 90)">
    <rect width="280" height="215" rx="12" fill="#F0F7F4" stroke="#32705C" stroke-width="1.5"/>
    <circle cx="140" cy="45" r="26" fill="rgba(50, 112, 92, 0.15)"/>
    <text x="140" y="53" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">📱</text>
    <text x="140" y="95" font-family="'Heebo', system-ui, sans-serif" font-size="16" font-weight="800" fill="#235243" text-anchor="middle">ארנק דיגיטלי / 1-Click</text>

    <!-- Pain Indicator Low -->
    <rect x="30" y="115" width="220" height="24" rx="12" fill="#F2E7EB"/>
    <rect x="30" y="115" width="55" height="24" rx="12" fill="#32705C"/>
    <text x="140" y="131" font-family="'Heebo', system-ui, sans-serif" font-size="11" font-weight="800" fill="#235243" text-anchor="middle">חיכוך נמוך (Frictionless)</text>

    <text x="250" y="168" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="600" fill="#252329" text-anchor="end">• ניתוק פסיכולוגי בין הקנייה לעלות</text>
    <text x="250" y="190" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="600" fill="#252329" text-anchor="end">• הגדלת סל הקנייה הממוצע ב-20%–40%</text>
  </g>
</svg>