<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <radialGradient id="heat-high" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat-med" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="700" height="380" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

  <!-- Left: E-Commerce / Package Interface Wireframe -->
  <g transform="translate(40, 40)">
    <rect width="320" height="300" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    
    <!-- Product Image Box -->
    <rect x="20" y="20" width="280" height="130" rx="6" fill="#334155" stroke="#64748b" stroke-width="0.8"/>
    <text x="160" y="90" font-family="'Heebo', system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">תמונת מוצר מרכזית</text>

    <!-- Product Title & Rating -->
    <rect x="20" y="165" width="180" height="16" rx="4" fill="#64748b"/>
    <text x="210" y="178" font-family="system-ui, sans-serif" font-size="12" fill="#fbbf24">★★★★★</text>

    <!-- Price Tag -->
    <rect x="20" y="195" width="90" height="26" rx="6" fill="#0284c7"/>
    <text x="65" y="213" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">₪ 199.90</text>

    <!-- CTA Button -->
    <rect x="20" y="240" width="280" height="38" rx="8" fill="#10b981"/>
    <text x="160" y="264" font-family="'Heebo', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">הוסף לסל הקניות</text>

    <!-- Eye Tracking Heatmap Overlays (F-Shape Pattern) -->
    <!-- Hotspot 1: Product Center -->
    <circle cx="160" cy="85" r="75" fill="url(#heat-high)"/>
    <circle cx="160" cy="85" r="30" fill="#ef4444" fill-opacity="0.85"/>
    <text x="160" y="90" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1 (קשב ראשוני)</text>

    <!-- Hotspot 2: Price -->
    <circle cx="65" cy="208" r="50" fill="url(#heat-high)"/>
    <circle cx="65" cy="208" r="18" fill="#ef4444" fill-opacity="0.9"/>
    <text x="65" y="212" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">2</text>

    <!-- Hotspot 3: CTA Button -->
    <circle cx="160" cy="259" r="45" fill="url(#heat-med)"/>
    <circle cx="160" cy="259" r="15" fill="#f59e0b" fill-opacity="0.9"/>
    <text x="160" y="263" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">3</text>

    <!-- Gaze Path Saccades -->
    <path d="M160,85 L65,208 L160,259" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  </g>

  <!-- Right: Scientific & Marketing Legend -->
  <g transform="translate(390, 45)">
    <text x="280" y="25" font-family="'Heebo', system-ui, sans-serif" font-size="19" font-weight="800" fill="#38bdf8" text-anchor="end">הדמיית מפת חום לקשב חזותי</text>
    <text x="280" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">Eye-Tracking Gaze &amp; Saliency Map</text>

    <!-- Principle 1 -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="280" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <circle cx="260" cy="26" r="10" fill="#ef4444"/>
      <text x="240" y="22" font-family="'Heebo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="end">Bottom-Up Saliency (בולטות חזותית)</text>
      <text x="240" y="39" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">צבע עז, ניגודיות גבוהה, תנועה ופנים מושכים קשב מידי</text>
    </g>

    <!-- Principle 2 -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="280" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <circle cx="260" cy="26" r="10" fill="#38bdf8"/>
      <text x="240" y="22" font-family="'Heebo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="end">Top-Down Goal (קשב מכוון מטרה)</text>
      <text x="240" y="39" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">סריקה מתודית לפי כוונת הקנייה (חיפוש מחיר וכפתור הזמנה)</text>
    </g>

    <!-- Principle 3 -->
    <g transform="translate(0, 198)">
      <rect x="0" y="0" width="280" height="66" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1"/>
      <text x="265" y="24" font-family="'Heebo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc" text-anchor="end">דפוס הסריקה הנפוץ: F-Pattern</text>
      <text x="265" y="44" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#e0f2fe" text-anchor="end">צרכנים סורקים את החלק העליון מימין לשמאל,</text>
      <text x="265" y="58" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#e0f2fe" text-anchor="end">ואז יורדים בציר האנכי אל מוקדי הפעולה.</text>
    </g>
  </g>
</svg>
