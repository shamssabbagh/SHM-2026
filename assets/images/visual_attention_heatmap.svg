<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- מוקד חום אדום-קורל לוהט (קיבוע 1 ו-CTA) -->
    <radialGradient id="hotSpotRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.92"/>
      <stop offset="38%" stop-color="#f43f5e" stop-opacity="0.70"/>
      <stop offset="72%" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- מוקד חום כתום-ענבר בינוני -->
    <radialGradient id="hotSpotOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.50"/>
      <stop offset="85%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <filter id="cardDrop" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- רקע ראשי כהה -->
  <rect width="1100" height="560" rx="22" fill="url(#bgHeat)" stroke="#1e293b" stroke-width="1.8"/>

  <!-- כותרת -->
  <text x="550" y="42" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">
    סימולציית מעקב עיניים (Eye-Tracking): תבנית סריקה למול בולטות חזותית (Itti &amp; Koch, 2001)
  </text>
  <text x="550" y="68" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">
    הבחנה בין סריקת טקסט סדרתית (F-Pattern) לבין לכידת קשב מבוססת בולטות (Perceptual Saliency: פנים, ניגודיות וכפתור הנעה לפעולה)
  </text>

  <!-- ==================== חלון דפדפן מסחר אלקטרוני (צד ימין) ==================== -->
  <g transform="translate(390, 90)" filter="url(#cardDrop)">
    <!-- מסגרת הדפדפן -->
    <rect width="660" height="425" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- סרגל עליון של דפדפן -->
    <rect width="660" height="36" rx="16" fill="#1e293b"/>
    <circle cx="24" cy="18" r="6" fill="#ef4444"/>
    <circle cx="44" cy="18" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="18" r="6" fill="#10b981"/>
    <rect x="140" y="8" width="380" height="20" rx="10" fill="#0f172a" opacity="0.95"/>
    <text x="330" y="22" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">https://luxury-perfume-store.co.il/flagship</text>

    <!-- שלד עמוד המוצר -->
    <!-- תמונת גיבור עם פנים אנושיות (צד ימין של הדף) -->
    <rect x="380" y="55" width="250" height="225" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- אילוסטרציית דמות ובקבוק בושם -->
    <circle cx="505" cy="128" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="492" cy="122" r="4.5" fill="#38bdf8"/>
    <circle cx="518" cy="122" r="4.5" fill="#38bdf8"/>
    <path d="M495 142 Q505 150 515 142" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <rect x="445" y="182" width="120" height="75" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="505" y="224" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800">פנים אנושיות + מוצר</text>

    <!-- כותרת ומחיר (צד שמאל של הדף) -->
    <rect x="35" y="60" width="315" height="32" rx="6" fill="#1e293b"/>
    <text x="335" y="81" text-anchor="end" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="800">בושם יוקרה במהדורה מוגבלת</text>

    <!-- תג מחיר ומבצע -->
    <rect x="200" y="108" width="150" height="44" rx="8" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="275" y="136" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="800">₪299 במקום ₪450</text>

    <!-- שורות טקסט רגילות (אזור עיוורון באנרים / דילוג) -->
    <rect x="35" y="170" width="315" height="12" rx="4" fill="#1e293b"/>
    <rect x="65" y="192" width="285" height="12" rx="4" fill="#1e293b"/>
    <rect x="110" y="214" width="240" height="12" rx="4" fill="#162032"/>
    <rect x="140" y="236" width="210" height="12" rx="4" fill="#162032"/>

    <!-- כפתור הנעה לפעולה CTA בולט -->
    <rect x="140" y="298" width="210" height="52" rx="12" fill="#f43f5e" stroke="#fb7185" stroke-width="2"/>
    <text x="245" y="330" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">הוספה לסל הקניות ←</text>

    <!-- באנר צדדי (דוגמה ל-Banner Blindness) -->
    <rect x="380" y="300" width="250" height="95" rx="10" fill="#162032" stroke="#334155" stroke-dasharray="5,5"/>
    <text x="505" y="343" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="700">אזור "עיוורון באנרים"</text>
    <text x="505" y="363" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">(קשב חזותי נמוך מאוד — 4% בלבד)</text>

    <!-- ==================== שכבת מפת החום (Heatmap Overlay) ==================== -->
    <!-- מוקד 1: פנים אנושיות -->
    <circle cx="505" cy="130" r="92" fill="url(#hotSpotRed)"/>
    <!-- מוקד 2: כותרת ראשית -->
    <ellipse cx="250" cy="76" rx="110" ry="42" fill="url(#hotSpotOrange)"/>
    <!-- מוקד 3: מחיר המבצע -->
    <circle cx="275" cy="130" r="72" fill="url(#hotSpotRed)"/>
    <!-- מוקד 4: כפתור הקנייה CTA -->
    <ellipse cx="245" cy="324" rx="95" ry="58" fill="url(#hotSpotRed)"/>

    <!-- ==================== מסלול תנועות עיניים (Saccades & Fixations) ==================== -->
    <path d="M 505 125 L 285 76 L 275 130 L 245 324" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7,5"/>

    <!-- נקודות קיבוע ממוספרות (Fixation Points) -->
    <g font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      <circle cx="505" cy="125" r="15" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="505" y="130" fill="#38bdf8">1</text>

      <circle cx="285" cy="76" r="15" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="285" y="81" fill="#38bdf8">2</text>

      <circle cx="275" cy="130" r="15" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="275" y="135" fill="#38bdf8">3</text>

      <circle cx="245" cy="324" r="15" fill="#f43f5e" stroke="#ffffff" stroke-width="2.5"/>
      <text x="245" y="329" fill="#ffffff">4</text>
    </g>
  </g>

  <!-- ==================== פאנל הסבר ומקרא (צד שמאל) ==================== -->
  <g transform="translate(45, 90)" filter="url(#cardDrop)">
    <rect width="315" height="425" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <text x="290" y="38" text-anchor="end" fill="#f8fafc" font-family="sans-serif" font-size="19" font-weight="800">ממצאי מעקב עיניים מרכזיים</text>
    <line x1="25" y1="52" x2="290" y2="52" stroke="#334155" stroke-width="1.5"/>

    <!-- שלבי הסריקה -->
    <g text-anchor="end" font-family="sans-serif">
      <text x="290" y="82" fill="#fb7185" font-size="14.5" font-weight="800">1. הטיית פנים ומבט (Face Bias):</text>
      <text x="290" y="102" fill="#cbd5e1" font-size="13">העין האנושית נמשכת אוטומטית לפנים ולכיוון</text>
      <text x="290" y="120" fill="#94a3b8" font-size="13">המבט של הדמות תוך פחות מ-200 מילי-שניות.</text>

      <text x="290" y="154" fill="#38bdf8" font-size="14.5" font-weight="800">2. F-Pattern מול מפת בולטות:</text>
      <text x="290" y="174" fill="#cbd5e1" font-size="13">בעמודי תוכן צפופים העין סורקת בתבנית F,</text>
      <text x="290" y="192" fill="#94a3b8" font-size="13">אך בדפי מוצר הקשב נקבע לפי בולטות חזותית.</text>

      <text x="290" y="226" fill="#34d399" font-size="14.5" font-weight="800">3. בולטות כפתור הפעולה (CTA):</text>
      <text x="290" y="246" fill="#cbd5e1" font-size="13">ניגודיות צבע גבוהה ושטח לבן (Whitespace)</text>
      <text x="290" y="264" fill="#94a3b8" font-size="13">ממקדים את נקודת הקיבוע הסופית ברכישה.</text>

      <text x="290" y="298" fill="#a78bfa" font-size="14.5" font-weight="800">4. עיוורון באנרים (Banner Blindness):</text>
      <text x="290" y="318" fill="#cbd5e1" font-size="13">המוח מסנן אוטומטית אזורים שנראים</text>
      <text x="290" y="336" fill="#94a3b8" font-size="13">כפרסומת צדדית או כטקסט גנרי עמוס.</text>
    </g>

    <!-- סרגל מקרא חום -->
    <text x="290" y="374" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="12.5" font-weight="700">עוצמת קיבוע מבט (Fixation Duration):</text>
    <linearGradient id="legendBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <rect x="25" y="384" width="265" height="14" rx="7" fill="url(#legendBar)" stroke="#334155" stroke-width="1"/>
    <text x="25" y="413" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">קשב נמוך</text>
    <text x="290" y="413" text-anchor="end" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="800">קשב מרבי (Hotspot)</text>
  </g>
</svg>