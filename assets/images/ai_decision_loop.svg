<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F5"/>
      <stop offset="100%" stop-color="#F7F3ED"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#502638"/>
    </marker>
  </defs>

  <rect width="720" height="320" rx="14" fill="url(#aiBgGrad)" stroke="#DEC7D0" stroke-width="1.5"/>

  <text x="680" y="38" font-family="'Heebo', system-ui, sans-serif" font-size="19" font-weight="800" fill="#502638" text-anchor="end">סוכני בינה מלאכותית ועתיד ההחלטות הצרכניות</text>
  <text x="680" y="58" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#5A5258" text-anchor="end">מיפוי הטיות אישיות ומעבר מצרכן אנושי ללקוח אלגוריתמי</text>

  <!-- Circular feedback flow (RTL: 1 on right -> 2 in middle -> 3 on left) -->
  <g transform="translate(60, 95)">
    <!-- Stage 1 (Right) -->
    <g transform="translate(420, 0)">
      <rect width="180" height="175" rx="12" fill="#FFFFFF" stroke="#D85B49" stroke-width="1.5"/>
      <circle cx="90" cy="35" r="20" fill="rgba(216, 91, 73, 0.12)"/>
      <text x="90" y="42" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">👁️</text>
      <text x="90" y="75" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="800" fill="#502638" text-anchor="middle">שלב 1: ניטור התנהגותי</text>
      <text x="90" y="105" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#5A5258" text-anchor="middle">מעקב אחר זמני תגובה</text>
      <text x="90" y="125" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#5A5258" text-anchor="middle">סריקת מבטים ועגלות קנייה</text>
      <text x="90" y="147" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="600" fill="#B83D2B" text-anchor="middle">איסוף אותות פסיכולוגיים</text>
    </g>

    <!-- Arrow 1 -> 2 (RTL: from x=420 pointing left to x=395) -->
    <line x1="415" y1="85" x2="395" y2="85" stroke="#502638" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Stage 2 (Center) -->
    <g transform="translate(210, 0)">
      <rect width="180" height="175" rx="12" fill="#FFFFFF" stroke="#C87A28" stroke-width="1.5"/>
      <circle cx="90" cy="35" r="20" fill="rgba(200, 122, 40, 0.12)"/>
      <text x="90" y="42" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🧠</text>
      <text x="90" y="75" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="800" fill="#502638" text-anchor="middle">שלב 2: מיפוי הטיות</text>
      <text x="90" y="105" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#5A5258" text-anchor="middle">זיהוי רגישות לעוגן מחיר</text>
      <text x="90" y="125" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#5A5258" text-anchor="middle">עוצמת שנאת הפסד ו-FOMO</text>
      <text x="90" y="147" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="600" fill="#8C5110" text-anchor="middle">פרופיל קוגניטיבי דינמי</text>
    </g>

    <!-- Arrow 2 -> 3 (RTL: from x=205 pointing left to x=185) -->
    <line x1="205" y1="85" x2="185" y2="85" stroke="#502638" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Stage 3 (Left) -->
    <g transform="translate(0, 0)">
      <rect width="180" height="175" rx="12" fill="#FFFFFF" stroke="#32705C" stroke-width="1.5"/>
      <circle cx="90" cy="35" r="20" fill="rgba(50, 112, 92, 0.12)"/>
      <text x="90" y="42" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🎯</text>
      <text x="90" y="75" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="800" fill="#502638" text-anchor="middle">שלב 3: התאמה אישית</text>
      <text x="90" y="105" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#5A5258" text-anchor="middle">הצגת מסגור מותאם בזמן אמת</text>
      <text x="90" y="125" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#5A5258" text-anchor="middle">למיקסום סבירות הרכישה</text>
      <text x="90" y="147" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="600" fill="#235243" text-anchor="middle">החלטה מתווכת אלגוריתם</text>
    </g>
  </g>
</svg>