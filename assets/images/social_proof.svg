<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" height="100%">
  <rect width="720" height="320" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

  <text x="680" y="38" font-family="'Heebo', system-ui, sans-serif" font-size="19" font-weight="800" fill="#38bdf8" text-anchor="end">הוכחה חברתית והשפעה נורמטיבית (Social Proof)</text>
  <text x="680" y="58" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">עקרונות ההשפעה של רוברט צ'אלדיני: קונפורמיות וצמצום אי-ודאות</text>

  <!-- 3 Social signals badges -->
  <g transform="translate(60, 90)">
    <!-- Badge 1: Real-time viewer count -->
    <g transform="translate(0, 0)">
      <rect width="180" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="90" cy="45" r="24" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="90" y="52" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">👀</text>
      <text x="90" y="95" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc" text-anchor="middle">דחיפות ועניין פעיל</text>
      <rect x="20" y="115" width="140" height="30" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="90" y="135" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle">"עוד 18 איש צופים כעת"</text>
    </g>

    <!-- Badge 2: User Ratings & Reviews -->
    <g transform="translate(210, 0)">
      <rect width="180" height="180" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="90" cy="45" r="24" fill="rgba(251, 191, 36, 0.15)"/>
      <text x="90" y="52" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⭐</text>
      <text x="90" y="95" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fde68a" text-anchor="middle">אישור ההמון (Crowd)</text>
      <rect x="20" y="115" width="140" height="30" rx="6" fill="rgba(251, 191, 36, 0.2)"/>
      <text x="90" y="135" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle">4.9 / 5 (3,420 חוות דעת)</text>
    </g>

    <!-- Badge 3: Best Seller / Trending -->
    <g transform="translate(420, 0)">
      <rect width="180" height="180" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="90" cy="45" r="24" fill="rgba(52, 211, 153, 0.15)"/>
      <text x="90" y="52" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🔥</text>
      <text x="90" y="95" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" text-anchor="middle">רב-מכר (Best Seller)</text>
      <rect x="20" y="115" width="140" height="30" rx="6" fill="rgba(52, 211, 153, 0.2)"/>
      <text x="90" y="135" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="700" fill="#d1fae5" text-anchor="middle">הנמכר ביותר בקטגוריה</text>
    </g>
  </g>
</svg>
