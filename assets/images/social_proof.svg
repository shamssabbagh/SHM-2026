<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" height="100%">
  <defs>
    <linearGradient id="socialBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F5"/>
      <stop offset="100%" stop-color="#F7F3ED"/>
    </linearGradient>
  </defs>

  <rect width="720" height="320" rx="14" fill="url(#socialBgGrad)" stroke="#DEC7D0" stroke-width="1.5"/>

  <text x="680" y="38" font-family="'Heebo', system-ui, sans-serif" font-size="19" font-weight="800" fill="#502638" text-anchor="end">הוכחה חברתית והשפעה נורמטיבית (Social Proof)</text>
  <text x="680" y="58" font-family="'Assistant', system-ui, sans-serif" font-size="12" fill="#5A5258" text-anchor="end">עקרונות ההשפעה של רוברט צ'אלדיני: קונפורמיות וצמצום אי-ודאות</text>

  <!-- 3 Social signals badges -->
  <g transform="translate(60, 90)">
    <!-- Badge 1: Real-time viewer count -->
    <g transform="translate(420, 0)">
      <rect width="180" height="190" rx="12" fill="#FFFFFF" stroke="#D85B49" stroke-width="1.5"/>
      <circle cx="90" cy="45" r="24" fill="rgba(216, 91, 73, 0.12)"/>
      <text x="90" y="52" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">👀</text>
      <text x="90" y="95" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="700" fill="#502638" text-anchor="middle">דחיפות ועניין פעיל</text>
      <rect x="15" y="120" width="150" height="32" rx="8" fill="rgba(216, 91, 73, 0.12)"/>
      <text x="90" y="141" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="700" fill="#B83D2B" text-anchor="middle">עוד 18 איש צופים כעת</text>
      <text x="90" y="172" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#756A72" text-anchor="middle">אפקט העדר ודחיפות</text>
    </g>

    <!-- Badge 2: User Ratings & Reviews -->
    <g transform="translate(210, 0)">
      <rect width="180" height="190" rx="12" fill="#FFFFFF" stroke="#C87A28" stroke-width="1.5"/>
      <circle cx="90" cy="45" r="24" fill="rgba(200, 122, 40, 0.12)"/>
      <text x="90" y="52" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⭐</text>
      <text x="90" y="95" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="700" fill="#502638" text-anchor="middle">אישור ההמון (Crowd)</text>
      <rect x="15" y="120" width="150" height="32" rx="8" fill="rgba(200, 122, 40, 0.12)"/>
      <text x="90" y="141" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8C5110" text-anchor="middle">4.9 מתוך 5 (3,420 ביקורות)</text>
      <text x="90" y="172" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#756A72" text-anchor="middle">הורדת סיכון נתפס</text>
    </g>

    <!-- Badge 3: Best Seller / Trending -->
    <g transform="translate(0, 0)">
      <rect width="180" height="190" rx="12" fill="#FFFFFF" stroke="#32705C" stroke-width="1.5"/>
      <circle cx="90" cy="45" r="24" fill="rgba(50, 112, 92, 0.12)"/>
      <text x="90" y="52" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🔥</text>
      <text x="90" y="95" font-family="'Heebo', system-ui, sans-serif" font-size="14" font-weight="700" fill="#502638" text-anchor="middle">רב-מכר (Best Seller)</text>
      <rect x="15" y="120" width="150" height="32" rx="8" fill="rgba(50, 112, 92, 0.12)"/>
      <text x="90" y="141" font-family="'Assistant', system-ui, sans-serif" font-size="12" font-weight="700" fill="#235243" text-anchor="middle">הנמכר ביותר בקטגוריה</text>
      <text x="90" y="172" font-family="'Assistant', system-ui, sans-serif" font-size="11" fill="#756A72" text-anchor="middle">תוקף חברתי מנצח</text>
    </g>
  </g>
</svg>